<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Significant Otter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
                     touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        canvas { display: block; }
        #embed-html { width: 100%; height: 100%; }
        #rotate { display: none; position: fixed; inset: 0; background: #000; color: #fcfcfc; z-index: 10;
                  font: bold 16px monospace; align-items: center; justify-content: center; text-align: center; }
        @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
</head>
<body>
    <div id="embed-html"></div>
    <div id="rotate">TURN YOUR PHONE SIDEWAYS<br>TO PLAY</div>
    <script>
        // iPhones mute web audio when the ring/silent switch is on silent; a game is "playback", like a video.
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    </script>
    <script>
        // Browsers only allow fullscreen from a tap, so every tap asks for it until the game
        // is finished (the game sets otterFinished at the very end). Phones also get locked
        // sideways while it lasts, where that's supported. iPhones' Safari has no fullscreen
        // for pages; there, adding the page to the home screen is what hides the browser bars.
        (function () {
            var root = document.documentElement;
            function goFullscreen() {
                if (window.otterFinished || document.fullscreenElement || document.webkitFullscreenElement) return;
                var request = root.requestFullscreen || root.webkitRequestFullscreen;
                if (!request) return;
                try {
                    var result = request.call(root, {navigationUI: 'hide'});
                    if (result && result.then) {
                        result.then(function () {
                            if (screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('landscape').catch(function () {});
                            }
                        }).catch(function () {});
                    }
                } catch (e) {}
            }
            ['pointerup', 'touchend', 'click', 'keyup'].forEach(function (name) {
                document.addEventListener(name, goFullscreen, true);
            });
        })();
    </script>
    <script src="html/html.nocache.js?v=1790462489996"></script>
</body>
</html>
